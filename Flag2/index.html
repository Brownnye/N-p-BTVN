<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Flags</title>
  </head>
  <body>
    <div id="container">
      <div id="flags">
        <div class="top">
          <div id="top-left">
            <div id="top-in-left"></div>
          </div>
          <div id="top-right">
            <div id="top-in-right"></div>
          </div>
        </div>
        <div class="under">
          <div id="under-left">
            <div id="under-in-left"></div>
          </div>
          <div id="under-right">
            <div id="under-in-right"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
